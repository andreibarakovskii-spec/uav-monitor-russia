name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site/data
          cp frontend/index.html site/index.html
          cp frontend/history.html site/history.html
          cp frontend/style.css site/style.css
          cp frontend/history.css site/history.css
          cp frontend/app.js site/app.js
          cp frontend/history.js site/history.js
          cp data/events.json site/data/events.json
          cp data/historical_analysis.json site/data/historical_analysis.json
          cp data/collector_status.json site/data/collector_status.json
          if [ -f data/quality_report.json ]; then cp data/quality_report.json site/data/quality_report.json; fi
          sed -i "s#fetch('../data/#fetch('data/#g" site/app.js site/history.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
