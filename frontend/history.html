<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAV Monitor — История</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>📊 История событий</h1>
      <p>Архивная аналитика публичных сообщений. Данные используются для анализа истории источников.</p>
    </div>
    <div class="status">● history mode</div>
  </div>

  <div class="cards">
    <div><span>Всего событий</span><b id="total">—</b></div>
    <div><span>Регионов</span><b id="regions">—</b></div>
    <div><span>Источников</span><b id="sources">—</b></div>
    <div><span>Последнее обновление</span><b id="updated">—</b></div>
  </div>

  <div class="grid">
    <section class="timeline-panel">
      <div class="panel-head"><h2>Активность регионов</h2></div>
      <div id="regionsList" class="feed"></div>
    </section>
    <section class="timeline-panel">
      <div class="panel-head"><h2>Источники</h2></div>
      <div id="sourcesList" class="feed"></div>
    </section>
  </div>

  <p class="muted">Исторический режим. Не является оперативной системой наблюдения.</p>
</div>
<script src="history.js"></script>
</body>
</html>
