<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAV Monitor — История</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="history.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>📊 История событий</h1>
      <p>Архивная аналитика публичных сообщений и источников.</p>
    </div>
    <div class="nav"><a href="index.html">🗺 Карта</a></div>
  </div>

  <div class="cards">
    <div><span>Всего событий</span><b id="total">—</b></div>
    <div><span>Регионов</span><b id="regions">—</b></div>
    <div><span>Источников</span><b id="sources">—</b></div>
    <div><span>Обновлено</span><b id="updated">—</b></div>
  </div>

  <section class="timeline-panel">
    <div class="panel-head"><h2>Фильтры архива</h2></div>
    <div id="historyFilters"></div>
  </section>

  <div class="grid">
    <section class="timeline-panel"><h2>Активность регионов</h2><div id="regionsList" class="feed"></div></section>
    <section class="timeline-panel"><h2>Источники</h2><div id="sourcesList" class="feed"></div></section>
  </div>

  <section class="timeline-panel">
    <h2>Динамика событий</h2>
    <div id="dailyChart" class="chart"></div>
  </section>

  <p class="muted">Исторический режим. Используется для анализа накопленных данных.</p>
</div>
<script src="history.js"></script>
</body>
</html>
